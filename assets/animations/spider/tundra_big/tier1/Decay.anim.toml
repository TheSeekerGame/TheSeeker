[asset]
key = "anim.tundra_big.Decay"
image = "animations/spider/tundra_big/tier1/Decay__r1c4__90x90.png"

[settings]
time_base = "Relative"
tick_quant = "8"
ticks_per_frame = 8
frame_min = 1
frame_max = 4
frame_start = 2

# Support left/right flipping
[[script]]
run_on_slot_enable = "DirectionLeft"
action = "SetSpriteFlip"
flip_x = true
[[script]]
run_on_slot_enable = "DirectionRight"
action = "SetSpriteFlip"
flip_x = false

# Decay rate control
[[script]]
run_on_slot_disable = "DecayRate"
action = "SetTicksPerFrame"
ticks_per_frame = 8
reset_progress = true


[[script]]
run_on_slot_enable = "DecayRate"
action = "SetTicksPerFrame"
ticks_per_frame = 8

[[script]]
run_at_frame = 4
action = "SetFrameNext"
frame_index = 4
