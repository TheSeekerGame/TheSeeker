[asset]
key = "anim.tundra_small.MeleeAttack"
image = "animations/spider/tundra_small/tier1/Attack__r1c5__48x48.png"

atlas_asset_key = "anim.tundra_small.MeleeAttack.sprite"

[playback]
start = 1
end = 5
ticks_per_frame = 8
mode = "loop"

[settings]
time_base = "Relative"
tick_quant = "8"
ticks_per_frame = 8
frame_min = 1
frame_max = 5
frame_start = 1

[[events]]
on = { frame_enter = 4 }
emit = "melee_active"

[[events]]
on = { frame_exit = 5 }
emit = "attack_done"

# LOOP
[[script]]
run_at_frame = 4
action = "PlayAudio"
asset_key = "audio.game.SmallSpiderAttack"

# Support left/right flipping
[[script]]
run_on_slot_enable = "DirectionLeft"
action = "SetSpriteFlip"
flip_x = true
[[script]]
run_on_slot_enable = "DirectionRight"
action = "SetSpriteFlip"
flip_x = false
