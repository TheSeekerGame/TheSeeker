[asset]
key = "anim.spider2.Death"
image = "animations/spider/big/tier2/Death__r1c7__48x48.png"

[settings]
time_base = "Relative"
tick_quant = "8"
ticks_per_frame = 8
frame_min = 1
frame_max = 7
frame_start = 1

[[script]]
run_on_playback_control = "Start"
action = "PlayAudio"
volume = 0.6
asset_key = "audio.game.BigSpiderDeath"

# Support left/right flipping
[[script]]
run_on_slot_enable = "DirectionLeft"
action = "SetSpriteFlip"
flip_x = true
[[script]]
run_on_slot_enable = "DirectionRight"
action = "SetSpriteFlip"
flip_x = false
