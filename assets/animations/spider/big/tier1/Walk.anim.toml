[asset]
key = "anim.spider.Walk"
image = "animations/spider/big/tier1/Walk__r1c10__90x90.png"

atlas_asset_key = "anim.spider.Walk.sprite"

[playback]
start = 1
end = 10
ticks_per_frame = 8
mode = "loop"

[settings]
time_base = "Relative"
tick_quant = "8"
ticks_per_frame = 8
frame_min = 1
frame_max = 10
frame_start = 1

[[frame_impulse]]
frame = 1
x = 1.0
y = 0.0

[[frame_impulse]]
frame = 2
x = 1.0
y = 0.0

[[frame_impulse]]
frame = 4
x = 1.0
y = 0.0

[[frame_impulse]]
frame = 6
x = 1.0
y = 0.0

[[frame_impulse]]
frame = 8
x = 1.0
y = 0.0

[[frame_impulse]]
frame = 10
x = 1.0
y = 0.0

# Support left/right flipping
[[script]]
run_on_slot_enable = "DirectionLeft"
action = "SetSpriteFlip"
flip_x = true
[[script]]
run_on_slot_enable = "DirectionRight"
action = "SetSpriteFlip"
flip_x = false
