[asset]
key = "anim.player.Jump"
image = "animations/player/movement/JumpSheet__r1c12__48x48.png"

[settings]
time_base = "Relative"
tick_quant = "8"
ticks_per_frame = 8
frame_min = 1
frame_max = 12
frame_start = 1

[[script]]
run_on_slot_enable = "Damaged"
action = "PlayAudio"
volume = 0.7
asset_key = "audio.game.PlayerGetsDamaged"

[[script]]
run_on_slot_enable = "XpOrb"
action = "PlayAudio"
volume = 0.5
asset_key = "audio.game.XpOrbs"

# INITIALIZE REGULAR JUMP
[[script]]
run_on_playback_control = "Start"
forbid_slots_all = ["AirJump"]
action = "SetFrameNow"
frame_index = 1

# INITIALIZE AIR JUMP
[[script]]
run_on_playback_control = "Start"
require_slots_all = ["AirJump"]
action = "SetFrameNow"
frame_index = 6

[[script]]
run_on_playback_control = "Start"
action = "PlayAudio"
volume = 0.5
asset_key = "audio.game.JumpStart"


# LOOP REGULAR JUMP
[[script]]
run_at_frame = 5
forbid_slots_all = ["AirJump"]
action = "SetFrameNext"
frame_index = 2

# LOOP AIR JUMP
[[script]]
run_at_frame = 12
require_slots_all = ["AirJump"]
action = "SetFrameNext"
frame_index = 9


# Support left/right flipping
[[script]]
run_on_slot_enable = "DirectionLeft"
action = "SetSpriteFlip"
flip_x = true
[[script]]
run_on_slot_enable = "DirectionRight"
action = "SetSpriteFlip"
flip_x = false
