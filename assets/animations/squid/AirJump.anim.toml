[asset]
key = "anim.squid.AirJump"
image = "animations/squid/AirJump__r1c5__32x32.png"

atlas_asset_key = "anim.squid.AirJump.sprite"

[settings]
time_base = "Relative"
tick_quant = "8"
ticks_per_frame = 6
frame_min = 1
frame_max = 5
frame_start = 1

# Loop the airborne segment (frames 3-5)
[[script]]
run_at_frame = 5
action = "SetFrameNext"
frame_index = 3

# Flip with facing slots
[[script]]
run_on_slot_enable = "DirectionLeft"
action = "SetSpriteFlip"
flip_x = false
[[script]]
run_on_slot_enable = "DirectionRight"
action = "SetSpriteFlip"
flip_x = true
