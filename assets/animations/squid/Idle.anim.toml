[asset]
key = "anim.squid.Idle"
image = "animations/squid/Idle__r1c18__32x32.png"

atlas_asset_key = "anim.squid.Idle.sprite"

[settings]
time_base = "Relative"
tick_quant = "8"
ticks_per_frame = 8
frame_min = 1
frame_max = 18
frame_start = 1

# Loop only the main body (frames 3-18)
[[script]]
run_at_frame = 18
action = "SetFrameNext"
frame_index = 3

# Flip with facing slots
[[script]]
run_on_slot_enable = "DirectionLeft"
action = "SetSpriteFlip"
flip_x = false
[[script]]
run_on_slot_enable = "DirectionRight"
action = "SetSpriteFlip"
flip_x = true
