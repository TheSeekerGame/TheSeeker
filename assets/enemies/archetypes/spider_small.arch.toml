schema_version = 2
id = "spider_small"
behavior = { kind = "combat", approach = "ground" }
actions = { Attack = "contact_strike" }
spawn_hp     = 220       # from enemy.cfg.toml
walk_speed   = 0.208     # ~20 pixels/second (20/96 = 0.208 px/tick)
chase_speed  = 0.365     # ~35 pixels/second (35/96 = 0.365 px/tick)
dmg_melee    = 20        # melee_damage from enemy.cfg.toml
dmg_ranged   = 0         # small melee spider has no ranged attack
vision_range = 120       # updated vision range per design spec
melee_range  = 24        # range_melee_melee from enemy.cfg.toml
reaction_time = 32       # 8 ticks (~83ms) reaction delay
[setup]
name = "Enemy"
controller = "ground"
collider = { half_extents = [4.0, 5.0] }
spawn_offset = [0.0, 14.0, 0.000014]
facing = "random_horizontal"
facing_slots = { right = "DirectionLeft", left = "DirectionRight" }
needs_line_of_sight = true

[setup.gfx]
offset = [0.0, 4.0, 0.0]

[anim]
Idle    = "anim.smallspider.Idle"
Walk    = "anim.smallspider.Walk"
Chase   = "anim.smallspider.Chase"
Attack  = "anim.smallspider.MeleeAttack"
Die     = "anim.smallspider.Death"
Decay   = "anim.smallspider.Decay"
Jump    = "anim.smallspider.Jump" 
